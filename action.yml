name: Slack PR status
description: Mirror pull request review status as emoji reactions on Slack posts that link to it
inputs:
  github-token:
    description: Token that can read pull requests in this repository
    default: ${{ github.token }}
  slack-token:
    description: Slack bot token with channels:history, groups:history, reactions:read and reactions:write
    required: true
  config:
    description: YAML configuration, see README
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci --omit=dev --ignore-scripts
      shell: bash
      working-directory: ${{ github.action_path }}
    - run: node src/main.ts
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SLACK_TOKEN: ${{ inputs.slack-token }}
        CONFIG: ${{ inputs.config }}
